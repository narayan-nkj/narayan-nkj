<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 120" width="100%" height="120">
  <defs>
    <style>
      @media (prefers-reduced-motion: reduce) {
        .seabed-blip { animation: none !important; }
      }
      .seabed-blip {
        animation: blinkContact 2s steps(2, start) infinite;
      }
      @keyframes blinkContact {
        to { visibility: hidden; }
      }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1280" height="120" fill="#f0f4f8"/>

  <!-- Seabed Contours -->
  <polygon points="0,95 240,85 520,105 840,80 1100,100 1280,88 1280,120 0,120" fill="#0d131f" opacity="0.8"/>
  <line x1="0" y1="85" x2="1280" y2="85" stroke="#0284c7" stroke-width="1" stroke-dasharray="10,6" opacity="0.4"/>

  <!-- Blinking Sonar Contact -->
  <rect class="seabed-blip" x="640" y="80" width="12" height="6" fill="#fbbf24"/>
  <circle cx="646" cy="83" r="16" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.5"/>
  <text class="mono" x="668" y="86" font-size="10" fill="#fbbf24">SIGNAL VERIFIED // SCAN TERMINATED</text>

  <!-- Tagline Quote -->
  <text class="mono" x="640" y="35" font-size="11" fill="#475569" text-anchor="middle">
    "The craft of engineering lies in turning mathematical beauty into dependable, unyielding reality."
  </text>
</svg>