<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 520" width="100%" height="100%">
  <defs>
    <style>
      @media (prefers-reduced-motion: reduce) {
        .sweep-arm { animation: none !important; }
      }
      .sweep-arm {
        transform-origin: 240px 240px;
        animation: radarSweep 6s linear infinite;
      }
      @keyframes radarSweep {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
    <linearGradient id="radarSweepGrad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(37,99,235,0.2)" stop-opacity="1"/>
      <stop offset="100%" stop-color="rgba(37,99,235,0.2)" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="480" height="520" fill="#f8fafc" rx="8" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Radar Header -->
  <text class="mono" x="24" y="28" font-size="11" fill="#2563eb" font-weight="600" letter-spacing="1">ACTIVITY RADAR // 30-DAY SONAR</text>
  <text class="mono" x="456" y="28" text-anchor="end" font-size="9" fill="#475569">TIME: ASIA/KOLKATA</text>

  <!-- Range Rings (Now -> 10d -> 20d -> 30d) -->
  <circle cx="240" cy="240" r="59.4" fill="none" stroke="#2563eb" stroke-width="0.8" stroke-opacity="0.3" stroke-dasharray="2,4"/>
  <circle cx="240" cy="240" r="118.8" fill="none" stroke="#2563eb" stroke-width="0.8" stroke-opacity="0.3" stroke-dasharray="2,4"/>
  <circle cx="240" cy="240" r="180" fill="none" stroke="#2563eb" stroke-width="1" stroke-opacity="0.6"/>

  <!-- Crosshairs -->
  <line x1="60" y1="240" x2="420" y2="240" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="240" y1="60" x2="240" y2="420" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Time of Day Labels (IST: 00 top, 06 right, 12 bottom, 18 left) -->
  <text class="mono" x="240" y="52" text-anchor="middle" font-size="9" fill="#475569">00:00</text>
  <text class="mono" x="428" y="243" text-anchor="start" font-size="9" fill="#475569">06:00</text>
  <text class="mono" x="240" y="436" text-anchor="middle" font-size="9" fill="#475569">12:00</text>
  <text class="mono" x="52" y="243" text-anchor="end" font-size="9" fill="#475569">18:00</text>

  <!-- Sweep Sector -->
  <g class="sweep-arm">
    <path d="M 240 240 L 240 60 A 180 180 0 0 1 366.0 114.0 Z" fill="url(#radarSweepGrad-light)"/>
    <line x1="240" y1="240" x2="240" y2="60" stroke="#2563eb" stroke-width="1.5"/>
  </g>

  <!-- Origin -->
  <circle cx="240" cy="240" r="3" fill="#2563eb"/>

  <!-- Activity Blips -->
  <circle cx="224.8" cy="230.1" r="3.5" fill="#0284c7" opacity="0.92"/>
<circle cx="185.3" cy="100.8" r="3.5" fill="#0284c7" opacity="0.38"/>
