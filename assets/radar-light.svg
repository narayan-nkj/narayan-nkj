<circle cx="333.6" cy="109.5" r="3.5" fill="#0284c7" opacity="0.33"/>
<circle cx="66.2" cy="258.1" r="3.5" fill="#0284c7" opacity="0.27"/>
<circle cx="206.1" cy="70.0" r="3.5" fill="#0284c7" opacity="0.28"/>
<circle cx="211.3" cy="69.1" r="3.5" fill="#0284c7" opacity="0.28"/>
<circle cx="142.7" cy="96.0" r="3.5" fill="#0284c7" opacity="0.28"/>
