<circle cx="121.7" cy="369.6" r="3.5" fill="#0284c7" opacity="0.27"/>


  <!-- Footer Caption -->
  <rect x="20" y="468" width="440" height="36" fill="#e2e8f0" rx="4" opacity="0.4"/>
  <text class="mono" x="240" y="490" text-anchor="middle" font-size="10" fill="#0f172a">19 contacts in 30 days • last contact 3 days ago (22 Nov 2026, 20:12 IST)</text>
</svg>