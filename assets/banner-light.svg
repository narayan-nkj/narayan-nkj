<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="100%" height="100%">
  <defs>
    <style>
      @media (prefers-reduced-motion: reduce) {
        .sweep, .pulse { animation: none !important; }
      }
      .sweep {
        transform-origin: 220px 160px;
        animation: sonarSweep 6s linear infinite;
      }
      .pulse-1 {
        animation: pingRing 3s cubic-bezier(0, 0.2, 0.8, 1) infinite;
      }
      .pulse-2 {
        animation: pingRing 3s cubic-bezier(0, 0.2, 0.8, 1) infinite 1.5s;
      }
      @keyframes sonarSweep {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes pingRing {
        0% { r: 20px; opacity: 0.9; }
        100% { r: 130px; opacity: 0; }
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      }
      .sans {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
    </style>
    <linearGradient id="sweepGrad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(37,99,235,0.25)" stop-opacity="1"/>
      <stop offset="100%" stop-color="rgba(37,99,235,0.25)" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="waveGrad-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="320" fill="#f8fafc"/>

  <!-- Cartesian Matrix Lines -->
  <line x1="0" y1="160" x2="1280" y2="160" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,6"/>
  <line x1="220" y1="0" x2="220" y2="320" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,6"/>
  <line x1="750" y1="0" x2="750" y2="320" stroke="#e2e8f0" stroke-width="0.7" stroke-dasharray="2,8"/>

  <!-- Background Signal Waveform -->
  <path d="M 400 160 Q 480 130, 560 160 T 720 160 T 880 160 T 1040 160 T 1200 160 T 1280 160" fill="none" stroke="url(#waveGrad-light)" stroke-width="2"/>
  <path d="M 400 160 Q 460 180, 520 160 T 680 160 T 840 160 T 1000 160 T 1160 160 T 1280 160" fill="none" stroke="url(#waveGrad-light)" stroke-width="1" stroke-opacity="0.6"/>

  <!-- Static Concentric Range Rings -->
  <circle cx="220" cy="160" r="30" fill="none" stroke="#2563eb" stroke-width="0.8" stroke-opacity="0.25"/>
  <circle cx="220" cy="160" r="65" fill="none" stroke="#2563eb" stroke-width="0.8" stroke-opacity="0.35"/>
  <circle cx="220" cy="160" r="100" fill="none" stroke="#2563eb" stroke-width="0.8" stroke-opacity="0.45"/>
  <circle cx="220" cy="160" r="130" fill="none" stroke="#2563eb" stroke-width="0.8" stroke-opacity="0.55"/>

  <!-- Animated Ping Rings -->
  <circle class="pulse-1" cx="220" cy="160" r="20" fill="none" stroke="#0284c7" stroke-width="1.5"/>
  <circle class="pulse-2" cx="220" cy="160" r="20" fill="none" stroke="#7c3aed" stroke-width="1.5"/>

  <!-- Sonar Center Ping Origin -->
  <circle cx="220" cy="160" r="3" fill="#0284c7"/>

  <!-- 60-degree Rotating Sonar Sweep Sector -->
  <g class="sweep">
    <path d="M 220 160 L 332 95 A 130 130 0 0 1 350 160 Z" fill="url(#sweepGrad-light)"/>
    <line x1="220" y1="160" x2="350" y2="160" stroke="#0284c7" stroke-width="1.5"/>
  </g>

  <!-- Telemetry Coordinates -->
  <text class="mono" x="220" y="27" text-anchor="middle" font-size="9" fill="#475569" letter-spacing="1.5">BEARING: 042° // RANGE: 14 STAGES // FREQ: 455 kHz</text>
  <text class="mono" x="1240" y="27" text-anchor="end" font-size="9" fill="#475569" letter-spacing="1.5">SYS_REF: SIG_RESOLVE_V2</text>

  <!-- Identity Typography -->
  <g transform="translate(420, 110)">
    <text class="mono" x="0" y="0" font-size="11" fill="#0284c7" letter-spacing="2.5">SIGNAL RESOLVED // ACADEMIC &amp; SYSTEMS PORTFOLIO</text>
    <text class="sans" x="0" y="38" font-size="34" font-weight="700" fill="#0f172a" letter-spacing="-0.5">Narayan Kumar Jha</text>
    <text class="sans" x="0" y="66" font-size="14" font-weight="400" fill="#475569">Student engineer building acoustic signal intelligence, deterministic verification gates, and digital-twin systems.</text>
    <text class="mono" x="0" y="92" font-size="11" fill="#475569">IIT Madras (BS Data Science) &bull; B.P. Poddar Institute (CSE)</text>
  </g>

  <!-- Subtle bottom border line -->
  <line x1="0" y1="319" x2="1280" y2="319" stroke="#e2e8f0" stroke-width="1"/>
</svg>