<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="100%" height="100%">
  <defs>
    <style>
      @media (prefers-reduced-motion: reduce) {
        .sweep, .pulse-1, .pulse-2 { animation: none !important; }
      }
      .sweep {
        transform-origin: 220px 160px;
        animation: sonarSweep 6s linear infinite;
      }
      .pulse-1 {
        animation: pingRing 3s cubic-bezier(0, 0.2, 0.8, 1) infinite;
      }
      .pulse-2 {
        animation: pingRing 3s cubic-bezier(0, 0.2, 0.8, 1) infinite 1.5s;
      }
      @keyframes sonarSweep {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes pingRing {
        0% { r: 20px; opacity: 0.9; }
        100% { r: 130px; opacity: 0; }
      }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
    <linearGradient id="sweepGrad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(96,165,250,0.35)" stop-opacity="1"/>
      <stop offset="100%" stop-color="rgba(96,165,250,0.35)" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="waveGrad-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" fill="#080b12"/>
  <line x1="0" y1="160" x2="1280" y2="160" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,6"/>
  <line x1="220" y1="0" x2="220" y2="320" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,6"/>
  <line x1="750" y1="0" x2="750" y2="320" stroke="#1e293b" stroke-width="0.7" stroke-dasharray="2,8"/>

  <path d="M 400 160 Q 480 130, 560 160 T 720 160 T 880 160 T 1040 160 T 1200 160 T 1280 160" fill="none" stroke="url(#waveGrad-dark)" stroke-width="2"/>
  <path d="M 400 160 Q 460 180, 520 160 T 680 160 T 840 160 T 1000 160 T 1160 160 T 1280 160" fill="none" stroke="url(#waveGrad-dark)" stroke-width="1" stroke-opacity="0.6"/>

  <circle cx="220" cy="160" r="30" fill="none" stroke="#60a5fa" stroke-width="0.8" stroke-opacity="0.25"/>
  <circle cx="220" cy="160" r="65" fill="none" stroke="#60a5fa" stroke-width="0.8" stroke-opacity="0.35"/>
  <circle cx="220" cy="160" r="100" fill="none" stroke="#60a5fa" stroke-width="0.8" stroke-opacity="0.45"/>
  <circle cx="220" cy="160" r="130" fill="none" stroke="#60a5fa" stroke-width="0.8" stroke-opacity="0.55"/>

  <circle class="pulse-1" cx="220" cy="160" r="20" fill="none" stroke="#67e8f9" stroke-width="1.5"/>
  <circle class="pulse-2" cx="220" cy="160" r="20" fill="none" stroke="#a78bfa" stroke-width="1.5"/>
  <circle cx="220" cy="160" r="3" fill="#67e8f9"/>

  <g class="sweep">
    <path d="M 220 160 L 332 95 A 130 130 0 0 1 350 160 Z" fill="url(#sweepGrad-dark)"/>
    <line x1="220" y1="160" x2="350" y2="160" stroke="#67e8f9" stroke-width="1.5"/>
  </g>

  <text class="mono" x="220" y="27" text-anchor="middle" font-size="9" fill="#94a3b8" letter-spacing="1.5">BEARING: 042° // RANGE: 14 STAGES // FREQ: 455 kHz</text>
  <text class="mono" x="1240" y="27" text-anchor="end" font-size="9" fill="#94a3b8" letter-spacing="1.5">SYS_REF: SIG_RESOLVE_V2</text>

  <g transform="translate(420, 110)">
    <text class="mono" x="0" y="0" font-size="11" fill="#67e8f9" letter-spacing="2.5">SIGNAL RESOLVED // ACADEMIC &amp; SYSTEMS PORTFOLIO</text>
    <text class="sans" x="0" y="38" font-size="34" font-weight="700" fill="#f1f5f9" letter-spacing="-0.5">Narayan Kumar Jha</text>
    <text class="sans" x="0" y="66" font-size="14" font-weight="400" fill="#94a3b8">Student engineer building acoustic signal intelligence, deterministic verification gates, and digital-twin systems.</text>
    <text class="mono" x="0" y="92" font-size="11" fill="#94a3b8">IIT Madras (BS Data Science) &#8226; B.P. Poddar Institute (CSE)</text>
  </g>

  <line x1="0" y1="319" x2="1280" y2="319" stroke="#1e293b" stroke-width="1"/>
</svg>